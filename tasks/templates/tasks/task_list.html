<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My tasks</title>
</head>
<body>
    <main>
        <h1>My tasks</h1>
        <p><a href="{% url 'tasks:create' %}">Add a task</a></p>
        <ul>
            {% for task in tasks %}
                <li>
                    <strong>{{ task.title }}</strong>
                    — due {{ task.due_date }}
                    — {{ task.get_priority_display }}
                    {% if task.completed %}(completed){% endif %}
                    <p>{{ task.description }}</p>
                </li>
            {% empty %}
                <li>You have no tasks yet.</li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
